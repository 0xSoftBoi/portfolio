<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Active learning performance and uncertainty calibration</title><desc id="desc">Left panel compares discovery acceleration factor across random, greedy, and UCB acquisition weights. Right panel shows uncertainty calibration diagnostics, including negative correlation between predicted uncertainty and error.</desc><rect width="1200" height="720" fill="#f5f2e8"/><style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#191c19}.s{font-family:Georgia,serif;fill:#191c19}.muted{fill:#68706a}.grid{stroke:#cfd4cd;stroke-width:1}.axis{stroke:#272d29;stroke-width:2}.accent{fill:#346b4a}.warn{fill:#8a4d3a}.bar{fill:#c7d5c9}.bar2{fill:#6f9178}.bar3{fill:#d2b4a8}</style><text x="60" y="62" class="t" font-size="18">MATBENCH_PEROVSKITES · 18,928 STRUCTURES · 5% BUDGET</text><text x="60" y="105" class="s" font-size="36">The mean helped. The uncertainty did not.</text><text x="60" y="140" class="s muted" font-size="20">Reported repository results; UCB score = μ − λσ.</text><line x1="60" y1="180" x2="1140" y2="180" class="axis"/><text x="60" y="225" class="t" font-size="18">DISCOVERY ACCELERATION FACTOR</text><line x1="80" y1="520" x2="600" y2="520" class="axis"/><line x1="80" y1="270" x2="80" y2="520" class="axis"/><g class="grid"><line x1="80" y1="470" x2="600" y2="470"/><line x1="80" y1="420" x2="600" y2="420"/><line x1="80" y1="370" x2="600" y2="370"/><line x1="80" y1="320" x2="600" y2="320"/></g><g class="t" font-size="14" fill="#68706a"><text x="48" y="525">0</text><text x="48" y="475">1</text><text x="48" y="425">2</text><text x="48" y="375">3</text><text x="48" y="325">4</text><text x="48" y="275">5</text></g><rect x="115" y="469" width="70" height="51" class="bar"/><rect x="215" y="262.5" width="70" height="257.5" class="bar2"/><rect x="315" y="261.5" width="70" height="258.5" class="accent"/><rect x="415" y="275.5" width="70" height="244.5" class="bar2"/><rect x="515" y="474.5" width="70" height="45.5" class="bar3"/><g class="t" font-size="14"><text x="121" y="548">Random</text><text x="221" y="548">Greedy</text><text x="316" y="548">UCB .5</text><text x="421" y="548">UCB 2</text><text x="521" y="548">UCB 5</text><text x="128" y="456">1.01</text><text x="228" y="250">5.15</text><text x="328" y="249">5.17</text><text x="428" y="263">4.89</text><text x="528" y="462">0.91</text></g><text x="665" y="225" class="t" font-size="18">CALIBRATION CHECK</text><text x="665" y="285" class="s" font-size="25">σ vs |error|</text><text x="1080" y="285" class="t warn" text-anchor="end" font-size="28">−0.47</text><text x="665" y="320" class="t muted" font-size="15">Spearman correlation · desired direction: positive</text><line x1="665" y1="350" x2="1110" y2="350" class="grid"/><text x="665" y="400" class="s" font-size="25">σ vs |μ|</text><text x="1080" y="400" class="t warn" text-anchor="end" font-size="28">−0.72</text><text x="665" y="435" class="t muted" font-size="15">Control for prediction-magnitude artifact</text><line x1="665" y1="465" x2="1110" y2="465" class="grid"/><text x="665" y="515" class="s" font-size="25">Coverage</text><text x="1080" y="515" class="t warn" text-anchor="end" font-size="24">2% / 12%</text><text x="665" y="550" class="t muted" font-size="15">Observed at nominal 68% / 95% intervals</text><rect x="665" y="595" width="445" height="72" rx="4" fill="#e7e9e2"/><text x="690" y="625" class="t" font-size="15">INTERPRETATION</text><text x="690" y="652" class="s" font-size="18">Increasing λ gave a bad σ more authority.</text></svg>