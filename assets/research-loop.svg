<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Research publication loop</title><desc id="desc">A twelve-stage loop from decision question through evidence, quantitative validation, red-team review, publication, and post-publication updates. Failed gates route backward to earlier stages.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2e5b4b"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#9a4f3c"/></marker><style>.bg{fill:#f3f1eb}.box{fill:#fbfaf7;stroke:#bdb9ad;stroke-width:2}.gate{fill:#dce7e1;stroke:#2e5b4b;stroke-width:2}.t{font:600 18px system-ui,sans-serif;fill:#11120f}.s{font:14px system-ui,sans-serif;fill:#66685f}.n{font:12px ui-monospace,monospace;fill:#2e5b4b;letter-spacing:.08em}.flow{fill:none;stroke:#2e5b4b;stroke-width:3;marker-end:url(#a)}.fail{fill:none;stroke:#9a4f3c;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#r)}.failt{font:600 12px ui-monospace,monospace;fill:#9a4f3c;letter-spacing:.06em}</style></defs><rect width="1200" height="720" class="bg"/><text x="70" y="60" class="n">SUWAPPU-GRADE RESEARCH LOOP</text><text x="70" y="96" class="t" style="font-size:30px;font-family:Georgia,serif;font-weight:400">Every pass must make the claim harder to fool.</text><g transform="translate(70 140)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">01 · QUESTION</text><text x="18" y="55" class="t">Decision + thesis</text><text x="18" y="78" class="s">What changes if this is true?</text></g><g transform="translate(350 140)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">02 · SOURCES</text><text x="18" y="55" class="t">Primary-source scan</text><text x="18" y="78" class="s">Build provenance before prose.</text></g><g transform="translate(630 140)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">03 · CLAIM</text><text x="18" y="55" class="t">Falsifiable statement</text><text x="18" y="78" class="s">Write what would disprove it.</text></g><g transform="translate(910 140)"><rect width="220" height="96" rx="4" class="gate"/><text x="18" y="28" class="n">GATE A</text><text x="18" y="55" class="t">Evidence ledger</text><text x="18" y="78" class="s">Observed · derived · estimate</text></g><g transform="translate(910 295)"><rect width="220" height="96" rx="4" class="box"/><text x="18" y="28" class="n">05 · METHOD</text><text x="18" y="55" class="t">Measure / model</text><text x="18" y="78" class="s">Reproducible inputs + procedure.</text></g><g transform="translate(630 295)"><rect width="240" height="96" rx="4" class="gate"/><text x="18" y="28" class="n">GATE B</text><text x="18" y="55" class="t">Quant validation</text><text x="18" y="78" class="s">Sensitivity · base rate · error.</text></g><g transform="translate(350 295)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">07 · RED TEAM</text><text x="18" y="55" class="t">Best alternative</text><text x="18" y="78" class="s">Find the strongest rival explanation.</text></g><g transform="translate(70 295)"><rect width="240" height="96" rx="4" class="gate"/><text x="18" y="28" class="n">GATE C</text><text x="18" y="55" class="t">Claim survives?</text><text x="18" y="78" class="s">Downgrade, qualify, or kill it.</text></g><g transform="translate(70 450)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">09 · VISUALS</text><text x="18" y="55" class="t">Show the evidence</text><text x="18" y="78" class="s">Charts / diagrams, not decoration.</text></g><g transform="translate(350 450)"><rect width="240" height="96" rx="4" class="gate"/><text x="18" y="28" class="n">GATE D</text><text x="18" y="55" class="t">Citation audit</text><text x="18" y="78" class="s">Every hard claim has provenance.</text></g><g transform="translate(630 450)"><rect width="240" height="96" rx="4" class="box"/><text x="18" y="28" class="n">11 · EDIT</text><text x="18" y="55" class="t">Compress the argument</text><text x="18" y="78" class="s">Lead with finding, cut scaffolding.</text></g><g transform="translate(910 450)"><rect width="220" height="96" rx="4" class="gate"/><text x="18" y="28" class="n">GATE E</text><text x="18" y="55" class="t">Publish / update</text><text x="18" y="78" class="s">Repro artifacts + revision log.</text></g><path d="M310 188H350M590 188H630M870 188H910M1020 236v59M910 343H870M630 343H590M350 343H310M190 391v59M310 498H350M590 498H630M870 498H910" class="flow"/><path d="M1020 546v70H190v-70" class="flow"/><text x="522" y="648" class="s">Post-publication evidence returns to the question. New facts reopen the loop.</text><path d="M1015 140V118H748V140" class="fail"/><text x="844" y="109" class="failt">WEAK PROVENANCE → SOURCES</text><path d="M748 295v-32H470v32" class="fail"/><text x="548" y="254" class="failt">FAILS SENSITIVITY → METHOD</text><path d="M190 295V264H748V236" class="fail"/><text x="335" y="255" class="failt">CLAIM FAILS → REWRITE / DOWNGRADE</text><path d="M470 450v-33H190v-26" class="fail"/><text x="245" y="409" class="failt">UNSOURCED CLAIM → EVIDENCE</text></svg>